name = "tai"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = false

# Names are public; values are encrypted Worker secrets configured separately.
[secrets]
required = ["APP_ORIGIN", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"]

[ai]
binding = "AI"

[vars]
RETURN_GAP_DAYS = "3"
AI_CALLS_ENABLED = "true"
AI_DAILY_TOTAL_LIMIT = "100"
AI_DAILY_CONCEPT_LIMIT = "10"
AI_DAILY_PACK_LIMIT = "20"
AI_DAILY_GRADING_LIMIT = "30"
AI_DAILY_SUPPORT_LIMIT = "40"
AI_DAILY_PRACTICAL_LIMIT = "10"
AI_PROVIDER = "workers_ai"
AI_GATEWAY_ID = "tai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[[d1_databases]]
binding = "DB"
database_name = "tai"
database_id = "64149050-28d3-489f-ae2f-80f1fa42a64b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "tai-originals"
